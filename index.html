head h1{font-size:48px}.explorer-head p{margin-bottom:0;color:var(--muted)}.lab{display:grid;grid-template-columns:250px minmax(0,1fr);gap:25px}.sidebar{background:#edf2ee;border-radius:15px;padding:20px;align-self:start}.sidebar .eyebrow{margin:0 0 15px}.scenario-button{width:100%;display:flex;gap:12px;text-align:left;padding:14px 12px;border:1px solid transparent;background:transparent;border-radius:9px;color:var(--ink);margin-bottom:5px}.scenario-button.active{background:white;border-color:var(--line);box-shadow:0 3px 10px #17323b08}.scenario-button .num{font-size:11px;color:var(--teal);padding-top:2px}.scenario-button strong{display:block;font-size:14px;line-height:1.3}.scenario-button small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.fluid-law{border-top:1px solid var(--line);padding-top:18px;margin-top:18px;font-size:12px;color:var(--muted)}.fluid-law strong{color:var(--ink)}.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:25px}.chart-title{display:flex;justify-content:space-between;align-items:center;gap:10px}.chart-title h2{font:600 19px 'Segoe UI',sans-serif;letter-spacing:0;margin:0}.legend{font-size:11px;display:flex;gap:16px;color:var(--muted)}.legend span:before{content:'';display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:2px;background:var(--teal)}.legend span:nth-child(2):before{background:var(--blue)}.legend span:nth-child(3):before{background:var(--rose)}.plot-wrap{display:grid;grid-template-columns:minmax(0,1fr) 160px;align-items:center;margin-top:22px}.plot svg{width:100%;display:block}.plot rect{transition:all 1.3s ease}.dials{border-left:1px solid var(--line);padding-left:17px;display:grid;gap:22px}.dial{text-align:center}.dial svg{width:135px;max-width:100%;display:block;margin:auto}.dial line{transition:transform 1s ease;transform-origin:50px 50px}.dial strong{display:block;font-size:11px;letter-spacing:1px}.dial small{color:var(--muted);font-size:12px}.phase-controls{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px}.phase-step{border:0;background:transparent;color:var(--muted);padding:8px;font-size:11px;border-radius:6px}.phase-step.active{background:var(--mint);color:var(--teal);font-weight:700}.icon-button{border:1px solid var(--line);background:white;color:var(--ink);padding:7px 11px;border-radius:6px;font-size:12px}.plot-note{font-size:11px;color:var(--muted);margin:12px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.metric{background:#edf4ef;border-radius:10px;padding:16px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:20px;font-weight:600}.mechanism{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;margin-top:20px}.mechanism .panel p{color:var(--muted);font-size:14px}.example{font-size:13px;padding:10px 0;border-top:1px solid var(--line)}.example-note{font-size:11px!important;color:#806744!important;background:#faf4e7;padding:10px;border-radius:6px;margin:8px 0 0!important}.inline-select{display:block;font-size:12px;color:var(--muted);margin-bottom:15px}.inline-select select{display:block;width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);background:white;border-radius:6px;color:var(--ink)}.theory-head{max-width:700px;margin-bottom:40px}.theory-layout{display:grid;grid-template-columns:190px minmax(0,1fr);gap:45px}.toc{position:sticky;top:25px;align-self:start;border-left:1px solid var(--line)}.toc a{display:block;text-decoration:none;color:var(--muted);font-size:13px;padding:9px 16px}.chapter{margin-bottom:45px;scroll-margin-top:25px}.chapter .eyebrow{margin-bottom:12px}.chapter p{color:var(--muted)}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.rule{background:white;border:1px solid var(--line);padding:22px;border-radius:12px;font-size:14px}.rule p{margin:0}.rule h3{color:var(--teal);font-size:15px}.compartments{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:25px 0}.compartments div{padding:23px;border-radius:12px;background:var(--mint)}.compartments div+div{background:#e7edf6}.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:13px;background:white;min-width:640px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line)}th{background:#eaf1ec;color:var(--muted);font-size:11px}td:first-child{font-weight:600}.theory-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.theory-cards .panel{font-size:13px}.theory-cards p{margin-bottom:15px}.dark-panel{background:var(--ink);color:white;border-radius:17px;padding:30px}.dark-panel p{color:#d1e2df}.dark-panel a{color:#a5d7cd}.source-link{font-size:12px}.skip{position:absolute;top:-100px}.skip:focus{top:5px;z-index:3;background:white;padding:10px}footer{padding:22px 5%;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px;max-width:1500px;margin:auto}footer a{text-decoration:none}@media(max-width:1050px){.hero{gap:25px}.lab{grid-template-columns:210px minmax(0,1fr)}.plot-wrap{grid-template-columns:1fr}.dials{grid-template-columns:1fr 1fr;border-left:0;border-top:1px solid var(--line);padding:12px 0;gap:12px}.dial svg{width:125px}.rules{grid-template-columns:1fr}.mechanism{grid-template-columns:1fr}.phase-controls{flex-wrap:wrap}}@media(max-width:720px){header{padding:18px 5%;flex-wrap:wrap;gap:12px}.edu{display:none}nav{margin:0 0 0 auto;gap:0}nav a{padding:7px 9px;font-size:12px}.brand{font-size:15px}.brandmark{width:34px;height:34px}main{padding-top:30px}.hero{grid-template-columns:1fr;gap:30px}.hero-visual{padding:20px}.scenario-grid{grid-template-columns:1fr 1fr}.scenario-card{padding:17px}.scenario-card h3{font-size:16px}.section-head{align-items:start;flex-direction:column;gap:5px;margin-top:40px}.lab{grid-template-columns:1fr}.sidebar{padding:15px}.scenario-list{display:grid;grid-template-columns:1fr 1fr}.scenario-button{padding:10px 8px}.fluid-law{display:none}.explorer-head{align-items:start;gap:15px}.explorer-head h1,.theory-head h1{font-size:39px}.explorer-head .btn{padding:8px 12px}.panel{padding:18px}.chart-title{flex-wrap:wrap}.metrics{gap:8px}.metric{padding:12px}.metric strong{font-size:16px}.phase-step{padding:6px;font-size:10px}.theory-layout{grid-template-columns:1fr;gap:20px}.toc{position:static;display:flex;flex-wrap:wrap;border:0;background:#eaf1ec;border-radius:10px}.toc a{font-size:11px;padding:8px 10px}.theory-cards{grid-template-columns:1fr}.compartments{grid-template-columns:1fr}footer{flex-direction:column;gap:6px}.notice{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<header><a class="brand" href="#home"><span class="brandmark">∿</span><span>Darrow-Yannet<small>FLUID PHYSIOLOGY LAB</small></span></a><nav aria-label="Main navigation"><a href="#home">Overview</a><a href="#explorer">Explorer</a><a href="#theory">Theory</a></nav><span class="edu">Educational use</span></header>
<main id="main"></main><footer><span>DARROW-YANNET EXPLORER</span><span>For education only · Not for medical diagnosis</span><a href="#theory">Read the theory ↗</a></footer>
<script>const SCENARIOS = [
  {
    "id": "isosmotic-contraction",
    "title": "Isosmotic Contraction",
    "subtitle": "Loss of isotonic fluid",
    "examples": [
      "Diarrhea",
      "Burns",
      "Hemorrhage"
    ],
    "ecfVolume": "decrease",
    "icfVolume": "none",
    "osmolarity": "none",
    "description": "Fluid with the same osmolarity as plasma is lost. ECF volume decreases, but there is no osmotic gradient between compartments. Note: [Pr] and Hct only increase in diarrhea; they do NOT change in burns or hemorrhages.",
    "hematocrit": "increase",
    "plasmaProtein": "increase"
  },
  {
    "id": "isosmotic-expansion",
    "title": "Isosmotic Expansion",
    "subtitle": "Gain of isotonic fluid",
    "examples": [
      "Isotonic saline infusion"
    ],
    "ecfVolume": "increase",
    "icfVolume": "none",
    "osmolarity": "none",
    "description": "Isotonic fluid is added to the ECF. ECF volume increases, but since osmolarity doesn't change, ICF volume remains the same.",
    "hematocrit": "decrease",
    "plasmaProtein": "decrease"
  },
  {
    "id": "hyperosmotic-contraction",
    "title": "Hyperosmotic Contraction",
    "subtitle": "Loss of free water",
    "examples": [
      "Sweating",
      "Fever",
      "Diabetes insipidus"
    ],
    "ecfVolume": "decrease",
    "icfVolume": "decrease",
    "osmolarity": "increase",
    "description": "Pure water or hypotonic solution is lost. ECF osmolarity increases, drawing water from the ICF to the ECF via osmosis. Both volumes decrease.",
    "hematocrit": "none",
    "plasmaProtein": "increase"
  },
  {
    "id": "hyperosmotic-expansion",
    "title": "Hyperosmotic Expansion",
    "subtitle": "Gain of NaCl or solutes",
    "examples": [
      "High salt intake",
      "Hypertonic mannitol infusion"
    ],
    "ecfVolume": "increase",
    "icfVolume": "decrease",
    "osmolarity": "increase",
    "description": "Solute is added to the ECF. ECF osmolarity increases, drawing water from the ICF. ECF expands at the expense of ICF contraction.",
    "hematocrit": "decrease",
    "plasmaProtein": "decrease"
  },
  {
    "id": "hyposmotic-contraction",
    "title": "Hyposmotic Contraction",
    "subtitle": "Loss of NaCl",
    "examples": [
      "Adrenal insufficiency (Addison's disease)"
    ],
    "ecfVolume": "decrease",
    "icfVolume": "increase",
    "osmolarity": "decrease",
    "description": "More solute than water is lost from the ECF. ECF osmolarity decreases, causing water to move into the ICF.",
    "hematocrit": "increase",
    "plasmaProtein": "increase"
  },
  {
    "id": "hyposmotic-expansion",
    "title": "Hyposmotic Expansion",
    "subtitle": "Gain of free water",
    "examples": [
      "SIADH (Syndrome of Inappropriate ADH)",
      "Water intoxication"
    ],
    "ecfVolume": "increase",
    "icfVolume": "increase",
    "osmolarity": "decrease",
    "description": "Pure water is retained or ingested. Osmolarity of all compartments decreases as water is distributed between ECF and ICF.",
    "hematocrit": "none",
    "plasmaProtein": "decrease"
  }
];</script><script>const PATHOLOGY = [["Infusion of Isotonic Saline", "Causes isosmotic expansion. Useful in hypovolemia but may worsen edema or heart failure if given excessively."], ["Infusion of Hypertonic Saline", "Produces hyperosmotic expansion. Raises ECF osmolality, pulling water from cells. Used in severe hyponatremia but requires controlled correction to avoid Osmotic Demyelination Syndrome."], ["Diabetes Insipidus", "Kidneys cannot conserve water. Causes hyperosmotic contraction as large amounts of dilute urine are lost. Leads to hypernatremia and intense thirst."], ["SIADH", "Excessive ADH causes water retention, lowering ECF osmolality. Water moves into cells, causing hyponatremia and dangerous cellular swelling (especially in the brain)."], ["Adrenal Insufficiency", "Loss of sodium (aldosterone deficiency) reduces ECF volume and osmolality. Water shifts into cells, causing ICF expansion alongside ECF contraction."], ["Uncontrolled Diabetes Mellitus", "Glucose acts as an effective osmole in the ECF, pulling water from cells. At the same time, it induces osmotic diuresis leading to water and solute loss."]];</script><script>const main = document.querySelector('main');
let selected = null, phase = 0, timers = [], caseExample = 'Diarrhea';
const symbols = {increase:'↑ Increase',decrease:'↓ Decrease',none:'— No change',variable:'↔ Variable'};
const notice = '<div class="notice"><strong>Educational use only.</strong> This application has no clinical scope and should not be used for medical diagnosis.</div>';
function stopAnimation(){timers.forEach(clearTimeout);timers=[];}
function miniDiagram(){return `<svg viewBox="0 0 540 340" role="img" aria-label="Darrow-Yannet baseline: intracellular fluid is two-thirds and extracellular fluid one-third of total body water"><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#dce7df" stroke-width="1"/></pattern></defs><rect x="35" y="40" width="465" height="250" fill="url(#grid)"/><path d="M40 40V290H500" stroke="#8da79d" fill="none"/><text x="44" y="25" font-size="10" fill="#61777b" letter-spacing="2">OSMOLALITY</text><rect x="95" y="110" width="240" height="180" rx="2" fill="#147d7218" stroke="#147d72" stroke-width="2"/><rect x="335" y="110" width="120" height="180" rx="2" fill="#6488ba18" stroke="#6488ba" stroke-width="2"/><text x="215" y="185" text-anchor="middle" font-family="Georgia" font-size="30" fill="#147d72">ICF</text><text x="215" y="209" text-anchor="middle" font-size="11" fill="#61777b">Intracellular fluid</text><text x="395" y="185" text-anchor="middle" font-family="Georgia" font-size="30" fill="#6488ba">ECF</text><text x="395" y="209" text-anchor="middle" font-size="11" fill="#61777b">Extracellular</text><text x="215" y="317" text-anchor="middle" font-size="12" fill="#61777b">⅔ total body water</text><text x="395" y="317" text-anchor="middle" font-size="12" fill="#61777b">⅓ total body water</text></svg>`;}
function home(){main.innerHTML=`<section class="hero"><div><div class="eyebrow">A visual approach to physiology</div><h1>See the shift.<br><em>Understand<br>the balance.</em></h1><p class="lead">Explore how water and solutes reshape the body's fluid compartments with the Darrow-Yannet diagram.</p><div class="actions"><a class="btn primary" href="#explorer">Enter Explorer <span>↗</span></a><a class="btn" href="#theory">Theoretical Aspects <span>→</span></a></div>${notice}</div><div class="hero-visual"><div class="visual-top"><span>THE BODY IN BALANCE</span><span class="tag">Baseline state</span></div>${miniDiagram()}<div class="visual-foot"><span>Two compartments. One equilibrium.</span><span>ICF + ECF</span></div></div></section><div class="section-head"><div><div class="eyebrow">Six patterns. A complete picture.</div><h2>Choose a scenario to explore.</h2></div><p>Follow the initial change through to equilibrium.</p></div><section class="scenario-grid" aria-label="Simulated scenarios">${SCENARIOS.map((s,i)=>`<a class="scenario-card" href="#explorer/${s.id}"><small>0${i+1} / ${i<2?'ISOSMOTIC':i<4?'HYPEROSMOTIC':'HYPOSMOTIC'}<span class="card-arrow">↗</span></small><h3>${s.title}</h3><p>${s.subtitle}</p></a>`).join('')}</section>`;}
function dial(label,symbol,color,id){return `<div class="dial"><svg viewBox="0 0 100 65" role="img" aria-label="${label}" id="${id}-svg"><path d="M10 50 A40 40 0 0 1 90 50" fill="none" stroke="#e5ece7" stroke-width="7" stroke-linecap="round"/><path d="M15 50 A35 35 0 0 1 85 50" fill="none" stroke="${color}" stroke-dasharray="1 5" stroke-width="2" opacity=".4"/><text x="8" y="63" font-size="8" fill="#61777b">−</text><text x="48" y="6" font-size="7" fill="#61777b">0</text><text x="86" y="63" font-size="8" fill="#61777b">+</text><line id="${id}-needle" x1="50" y1="50" x2="50" y2="17" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="${color}"/></svg><strong>${label}</strong><small id="${id}-value">${symbol} — No change</small></div>`;}
function plot(){return `<svg viewBox="0 0 720 385" role="img" aria-labelledby="chart-label"><title id="chart-label">Darrow-Yannet compartment shift, baseline state</title><defs><pattern id="plotgrid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#edf1ee"/></pattern></defs><rect x="45" y="35" width="635" height="280" fill="url(#plotgrid)"/><path d="M45 35V315H680" fill="none" stroke="#a6b7af" stroke-width="1.5"/><text x="45" y="22" fill="#61777b" font-size="11" letter-spacing="1.5">OSMOLALITY</text><text x="680" y="345" text-anchor="end" fill="#61777b" font-size="11" letter-spacing="1.5">VOLUME</text><rect x="100" y="115" width="280" height="200" fill="#147d7210" stroke="#147d72" stroke-width="2"/><rect x="380" y="115" width="140" height="200" fill="#6488ba10" stroke="#6488ba" stroke-width="2"/><line x1="380" y1="40" x2="380" y2="335" stroke="#c6d4cd" stroke-dasharray="4 5"/><rect id="icf-current" x="100" y="115" width="280" height="200" fill="#147d7207" stroke="#dc735b" stroke-width="3" stroke-dasharray="7 4"/><rect id="ecf-current" x="380" y="115" width="140" height="200" fill="#6488ba07" stroke="#dc735b" stroke-width="3" stroke-dasharray="7 4"/><text x="240" y="350" text-anchor="middle" fill="#147d72" font-size="20" font-family="Georgia">ICF</text><text x="450" y="350" text-anchor="middle" fill="#6488ba" font-size="20" font-family="Georgia">ECF</text><text id="water-arrow" x="380" y="92" text-anchor="middle" fill="#147d72" font-size="13"></text></svg>`;}
function explorer(){main.innerHTML=`<div class="explorer-head"><div><div class="eyebrow">Interactive laboratory</div><h1>Fluid shifts, revealed.</h1><p>Select a pattern. Watch the compartments respond.</p></div><button class="btn" id="reset">↺ Reset</button></div><div class="lab"><aside class="sidebar"><div class="eyebrow">Select a scenario</div><div class="scenario-list">${SCENARIOS.map((s,i)=>`<button class="scenario-button ${selected?.id===s.id?'active':''}" aria-pressed="${selected?.id===s.id}" data-scenario="${s.id}"><span class="num">0${i+1}</span><span><strong>${s.title}</strong><small>${s.subtitle}</small></span></button>`).join('')}</div><div class="fluid-law"><strong>Two fluid laws</strong><p>Water flows toward the higher osmolality.</p><p>ICF and ECF osmolality equilibrate after water redistribution.</p><a href="#theory">Explore the theory →</a></div></aside><div><section class="panel"><div class="chart-title"><h2>Compartment shift</h2><div class="legend"><span>ICF baseline</span><span>ECF baseline</span><span>Current state</span></div></div><div class="plot-wrap"><div class="plot">${plot()}</div><div class="dials">${dial('PLASMA PROTEINS','[Pr]','#6488ba','pr')}${dial('HEMATOCRIT','Hct','#dc735b','hct')}</div></div><div class="phase-controls"><div role="group" aria-label="Animation stages"><button class="phase-step active" data-phase="0">01 Baseline</button><button class="phase-step" data-phase="1">02 Initial ECF change</button><button class="phase-step" data-phase="2">03 Equilibrium</button></div><button class="icon-button" id="replay">↻ Replay</button></div><p class="plot-note" id="phase-note" aria-live="polite"></p><p class="plot-note">Schematic, qualitative changes; rectangle dimensions are illustrative and are not a quantitative osmole model.</p></section><section class="metrics" id="metrics" aria-label="Final pattern"></section><div class="mechanism" id="mechanism"></div></div></div>`;
 document.querySelectorAll('[data-scenario]').forEach(b=>b.onclick=()=>location.hash='explorer/'+b.dataset.scenario);
 document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{stopAnimation();phase=+b.dataset.phase;updatePlot();});
 document.querySelector('#reset').onclick=()=>{selected=null;caseExample='Diarrhea';location.hash='explorer';explorer();};
 document.querySelector('#replay').onclick=animate;
 updateDetails();updatePlot();if(selected)animate();
}
function animate(){stopAnimation();phase=0;updatePlot();if(!selected)return;timers=[setTimeout(()=>{phase=1;updatePlot();},600),setTimeout(()=>{phase=2;updatePlot();},2600)];}
function metric(label,value){return `<div class="metric"><small>${label}</small><strong>${symbols[value]}</strong></div>`;}
function exampleNote(ex){return ex==='Hemorrhage'?'<p class="example-note"><strong>Initial hemorrhage:</strong> Hct and [Pr] do not change initially because whole blood (both cells and plasma) is lost.</p>':ex==='Burns'?'<p class="example-note"><strong>Burns:</strong> Plasma protein concentration may decrease with capillary protein loss. The simple concentration pattern does not describe this exception.</p>':'';}
function updateDetails(){const s=selected;
 document.querySelector('#metrics').innerHTML=metric('FINAL ECF VOLUME',s?.ecfVolume||'none')+metric('FINAL ICF VOLUME',s?.icfVolume||'none')+metric('FINAL OSMOLALITY',s?.osmolarity||'none');
 document.querySelector('#mechanism').innerHTML=s?`<article class="panel"><div class="eyebrow">Physiological mechanism</div><h2 style="font-size:28px">${s.title}</h2><p>${s.id==='isosmotic-contraction'?'Fluid with the same osmolality as plasma is lost. ECF volume decreases without an osmotic gradient, so ICF volume is unchanged. The protein and hematocrit response depends on what is lost; select an example to see the exception.':s.description}</p></article><article class="panel"><div class="eyebrow">Clinical examples</div>${s.id==='isosmotic-contraction'?`<label class="inline-select">Indicator example<select id="example">${s.examples.map(ex=>`<option ${ex===caseExample?'selected':''}>${ex}</option>`).join('')}</select></label>`:''}${s.examples.map(ex=>`<div class="example"><strong>${ex}</strong>${exampleNote(ex)}</div>`).join('')}${['hyperosmotic-contraction','hyposmotic-expansion'].includes(s.id)?'<p class="example-note">Hematocrit can vary because plasma volume and red cell volume change together. The original diagram illustrates no net change; it is not a universal prediction.</p>':''}</article>`:`<article class="panel"><div class="eyebrow">Start with the baseline</div><h2 style="font-size:28px">A body in balance.</h2><p>Select one of the six scenarios to reveal its mechanism, final pattern and clinical examples.</p></article><article class="panel">${notice}</article>`;
 const select=document.querySelector('#example');if(select)select.onchange=()=>{caseExample=select.value;updatePlot();};
}
function indicatorValues(){if(!selected||phase===0)return ['none','none'];if(selected.id==='isosmotic-contraction'){if(caseExample==='Hemorrhage')return ['none','none'];if(caseExample==='Burns')return ['variable','variable'];}return [selected.plasmaProtein,selected.hematocrit];}
function updatePlot(){if(!document.querySelector('#icf-current'))return;
 let iw=280,ew=140,ih=200,eh=200;const s=selected;
 if(s&&phase===1){switch(s.id){case'isosmotic-contraction':ew-=60;break;case'isosmotic-expansion':ew+=60;break;case'hyperosmotic-contraction':ew-=80;eh+=65;break;case'hyperosmotic-expansion':eh+=65;break;case'hyposmotic-contraction':ew-=40;eh-=65;break;case'hyposmotic-expansion':ew+=90;eh-=65;}}
 if(s&&phase===2){iw+=s.icfVolume==='increase'?60:s.icfVolume==='decrease'?-60:0;ew+=s.ecfVolume==='increase'?60:s.ecfVolume==='decrease'?-60:0;ih+=s.osmolarity==='increase'?45:s.osmolarity==='decrease'?-45:0;eh=ih;}
 for(const [id,x,w,h] of [['icf-current',380-iw,iw,ih],['ecf-current',380,ew,eh]]){const el=document.getElementById(id);el.setAttribute('x',x);el.setAttribute('y',315-h);el.setAttribute('width',w);el.setAttribute('height',h);el.style.opacity=s?'1':'0';}
 document.querySelectorAll('[data-phase]').forEach(b=>{b.classList.toggle('active',+b.dataset.phase===phase);b.setAttribute('aria-pressed',+b.dataset.phase===phase);});
 const phaseLabels=['Baseline: both compartments have the same osmolality.','Initial change: the disturbance first affects the ECF.','Equilibrium: water redistribution brings both compartments to the same osmolality.'];
 document.querySelector('#phase-note').textContent=phaseLabels[phase];
 document.querySelector('#chart-label').textContent=`${s?.title||'Normal baseline'}: ${phaseLabels[phase]}`;
 document.querySelector('#water-arrow').textContent=s&&phase===2?(s.icfVolume==='decrease'?'Water → ECF':s.icfVolume==='increase'?'ICF ← Water':'No osmotic water shift'):'';
 indicatorValues().forEach((v,i)=>{const id=i?'hct':'pr';document.getElementById(id+'-needle').style.transform=`rotate(${v==='increase'?45:v==='decrease'?-45:0}deg)`;document.getElementById(id+'-needle').style.opacity=v==='variable'?'.3':'1';document.getElementById(id+'-value').textContent=(i?'Hct ':'[Pr] ')+symbols[v];document.getElementById(id+'-svg').setAttribute('aria-label',(i?'Hematocrit ':'Plasma proteins ')+symbols[v]);});
}
function theory(){main.innerHTML=`<div class="theory-head"><div class="eyebrow">Theoretical aspects</div><h1>The principles<br>behind <em>the picture.</em></h1><p class="lead">A guide to fluid compartments, osmotic shifts and the six Darrow-Yannet patterns.</p>${notice}</div><div class="theory-layout"><aside class="toc" aria-label="Theory chapters">${['Essential rules','Compartments','The diagram','Summary table','Clinical scenarios','Pathological situations','Key takeaways'].map((x,i)=>`<a href="#chapter-${i+1}" data-chapter="${i+1}">0${i+1} ${x}</a>`).join('')}</aside><div><section class="chapter" id="chapter-1"><div class="eyebrow">01 / Foundations</div><h2>The three essential rules.</h2><div class="rules"><div class="rule"><h3>Osmolality → cell volume</h3><p>ECF osmolality determines ICF volume. Hyperosmotic ECF shrinks cells; hyposmotic ECF swells cells; isosmotic ECF does not change cell volume.</p></div><div class="rule"><h3>Volume → circulation</h3><p>ECF volume determines circulatory consequences. Contraction reduces circulating volume; expansion may produce edema or volume overload.</p></div><div class="rule"><h3>Indicators → context</h3><p>Protein concentration reflects water and protein losses. Hematocrit reflects both plasma and red cell volume. Interpret these indicators together with the example.</p></div></div></section><section class="chapter" id="chapter-2"><div class="eyebrow">02 / Compartments</div><h2>Two spaces, connected by water.</h2><p>Total body water is distributed mainly between intracellular and extracellular fluid: approximately two-thirds inside cells and one-third outside cells.</p><div class="compartments"><div><h3>ICF · Intracellular</h3>Water inside cells (~⅔ of total body water). Volume changes depend on osmotic gradients.</div><div><h3>ECF · Extracellular</h3>Water outside cells (~⅓), divided into interstitial fluid and plasma.</div></div><p>Water moves by osmosis until both compartments reach equilibrium. An ECF volume change without an osmolality change does not significantly change ICF volume.</p></section><section class="chapter" id="chapter-3"><div class="eyebrow">03 / Reading the diagram</div><h2>A rectangle with a story.</h2><div class="rules"><div class="rule"><h3>Width = volume</h3><p>The horizontal axis represents compartment volume.</p></div><div class="rule"><h3>Height = osmolality</h3><p>The vertical axis represents concentration. ICF and ECF have the same height at equilibrium.</p></div><div class="rule"><h3>Area = total osmoles</h3><p>In a quantitative Darrow-Yannet diagram, area is volume × concentration. This explorer uses illustrative, qualitative dimensions.</p></div></div><p>Follow three stages: baseline → initial ECF change → water redistribution and final equilibrium.</p><div class="hero-visual">${miniDiagram()}</div></section><section class="chapter" id="chapter-4"><div class="eyebrow">04 / Reference</div><h2>Summary of major patterns.</h2><div class="table-scroll"><table><thead><tr><th scope="col">Disturbance</th><th scope="col">ECF volume</th><th scope="col">ICF volume</th><th scope="col">Osmolality</th><th scope="col">[Pr]</th><th scope="col">Hct</th></tr></thead><tbody>${SCENARIOS.map(s=>`<tr><th scope="row">${s.title}</th>${[s.ecfVolume,s.icfVolume,s.osmolarity,s.plasmaProtein,['hyperosmotic-contraction','hyposmotic-expansion'].includes(s.id)?'variable':s.hematocrit].map(v=>`<td>${v==='increase'?'↑':v==='decrease'?'↓':v==='variable'?'Variable':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source-link">Isosmotic contraction indicators represent the diarrhea pattern. Initially, hemorrhage leaves Hct and [Pr] unchanged; burns may cause protein loss.</p></section><section class="chapter" id="chapter-5"><div class="eyebrow">05 / Application</div><h2>Clinical scenarios.</h2><div class="theory-cards">${SCENARIOS.map(s=>`<article class="panel"><h3>${s.title}</h3><p>${s.id==='isosmotic-contraction'?'Isotonic fluid loss contracts ECF without changing ICF volume. Protein and hematocrit responses depend on the type of loss.':s.description}</p>${s.examples.map(ex=>`<div class="example"><strong>${ex}</strong>${exampleNote(ex)}</div>`).join('')}<a class="source-link" href="#explorer/${s.id}">Explore this pattern →</a></article>`).join('')}</div></section><section class="chapter" id="chapter-6"><div class="eyebrow">06 / Context</div><h2>Nonphysiological & pathological situations.</h2><div class="theory-cards">${PATHOLOGY.map(([title,content])=>`<article class="panel"><h3>${title}</h3><p>${content}</p></article>`).join('')}</div><p class="source-link">These examples illustrate physiology, not treatment recommendations. SIADH is commonly clinically euvolemic despite retained water; the diagram depicts an idealized compartment model.</p></section><section class="chapter dark-panel" id="chapter-7"><div class="eyebrow" style="color:#a5d7cd">07 / Takeaways</div><h2>Cellular vulnerability.<br>Vascular consequences.</h2><p>Brain cells are particularly sensitive to volume changes. Rapid correction of chronic hyponatremia can cause osmotic demyelination. Rapid correction of chronic hypernatremia can cause cerebral edema, particularly in children.</p><p>Isotonic fluid expands ECF without creating an osmotic water shift. Actual responses depend on the fluid, solutes and losses involved.</p><p class="source-link">Reference: <a href="https://renaissance.stonybrookmedicine.edu/sites/default/files/Disorders-of-plasma-sodium-NEJM-2015.pdf" target="_blank" rel="noopener">Disorders of Plasma Sodium — NEJM, 2015 ↗</a></p><a class="btn" href="#explorer">Return to the Explorer →</a></section></div></div>`;
 document.querySelectorAll('[data-chapter]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById('chapter-'+a.dataset.chapter).scrollIntoView({behavior:'smooth'});});
}
function route(){stopAnimation();phase=0;const [view,id]=location.hash.slice(1).split('/');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(view||'home')));if(view==='explorer'){selected=SCENARIOS.find(s=>s.id===id)||null;caseExample='Diarrhea';explorer();}else if(view==='theory')theory();else home();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);route();
</script></body></html>
